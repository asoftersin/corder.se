# Kontrollerar sajten och statistikmotorn vid varje push. Publiceringen sker separat via GitHub Pages.
name: Kontroll
on:
  push:
    branches: [main]
  pull_request:
jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sajten
        run: python build/kontrollera.py
      - name: Statistikmotorn
        working-directory: statistik
        run: node --test test/lib.test.js
